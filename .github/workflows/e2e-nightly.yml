name: E2E Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run E2E stack
        run: ./scripts/e2e.sh

      - name: Upload E2E compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-compose-logs
          path: e2e/logs/compose.log
          if-no-files-found: warn
