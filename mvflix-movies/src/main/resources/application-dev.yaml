server:
  port: 4040

management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
    port: ${MANAGEMENT_SERVER_PORT:10040}

spring:
  application:
    name: mvflix-movies
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9094}
    consumer:
      group-id: ${MOVIES_KAFKA_GROUP:mvflix-movies}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  codec:
    max-in-memory-size: 32MB

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/mvflix_movies_db
    username: ${DB_RW_USER:db_rw}
    password: ${DB_RW_PASSWORD:12345678}

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/mvflix_movies_db
    username: ${DB_MIGRATOR_USER:db_migrator}
    password: ${DB_MIGRATOR_PASSWORD:12345678}

services:
  authorization:
    url: ${AUTHORIZATION_URL:http://127.0.0.1:9090}
  storage:
    url: ${SERVICES_STORAGE_URL:http://127.0.0.1:6060}

mvflix:
  messaging:
    kafka:
      enabled: true
  security:
    actuator-username: ${ACTUATOR_METRICS_USER:metrics}
    actuator-password: ${ACTUATOR_METRICS_PASSWORD:change-me}

movies:
  draft:
    time-to-live: 24h
    cleanup-check-ms: 3600000
  enrich:
    check-ms: 3600000
  deletion:
    retry-delay: PT1M
    batch-size: 25
    concurrency: 4
  outbox:
    poll-interval: PT5S
    batch-size: 25
    concurrency: 4
    max-attempts: 10
    retry-delay: PT1M
    lease: PT2M

tmdb:
  api-token: ${TMDB_API_TOKEN:}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p

security:
  oauth2:
    jwk-set-uri: ${SECURITY_OAUTH2_JWK_SET_URI:http://127.0.0.1:9090/oauth2/jwks}

logging:
  level:
    root: info
    org.springframework.web: debug
    org.springframework.security: debug
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: trace
    org.springframework.security.oauth2: debug
    org.springframework.data.redis: debug
    jakarta.jms: debug
