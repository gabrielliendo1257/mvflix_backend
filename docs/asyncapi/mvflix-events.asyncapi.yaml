asyncapi: 2.6.0
info:
  title: Mvflix Integration Events
  version: 1.0.0
  description: |
    Contratos internos versionados para la integración asíncrona de Mvflix.
    Kafka entrega estos mensajes at-least-once: los consumidores deben
    deduplicar por eventId y aplicar efectos idempotentes. La metadata del evento
    forma parte del envelope JSON; no se duplica en headers Kafka.
  contact:
    name: Mvflix Architecture

defaultContentType: application/json

servers:
  development:
    url: localhost:9094
    protocol: kafka
    description: Kafka KRaft single-node de desarrollo, publicado en el host LAN configurado.

channels:
  mvflix.catalog-item-added.v1:
    description: Movies publica el alta persistida de un item de catálogo.
    publish:
      operationId: publishCatalogItemAdded
      x-owner: mvflix-movies
      x-delivery: at-least-once
      x-partition-key: aggregate.id
      message:
        $ref: '#/components/messages/CatalogItemAdded'

  mvflix.catalog-item-deleted.v1:
    description: Movies publica el borrado local efectivamente confirmado.
    publish:
      operationId: publishCatalogItemDeleted
      x-owner: mvflix-movies
      x-delivery: at-least-once
      x-partition-key: aggregate.id
      message:
         $ref: '#/components/messages/CatalogItemDeleted'

  mvflix.catalog-item-access-changed.v1:
    description: Movies publica un cambio conjunto de visibilidad y compartidos.
    publish:
      operationId: publishCatalogItemAccessChanged
      x-owner: mvflix-movies
      x-consumer: mvflix-activity
      x-delivery: at-least-once
      x-partition-key: aggregate.id
      message:
        $ref: '#/components/messages/CatalogItemAccessChanged'

  mvflix.managed-media-deletion-requested.v1:
    description: Movies solicita a Storage el borrado durable de un objeto MANAGED.
    publish:
      operationId: requestManagedMediaDeletion
      summary: Solicitud de borrado de un objeto MANAGED
      description: |
        Movies publica este mensaje después de persistir el estado DELETING.
        Storage es el propietario del objeto y de la cuota; el mensaje no
        autoriza a ningún consumidor a modificar el catálogo de Movies.
      x-owner: mvflix-movies
      x-consumer: mvflix-storage
      x-delivery: at-least-once
      x-partition-key: payload.storageId
      message:
        $ref: '#/components/messages/ManagedMediaDeletionRequested'

  mvflix.stored-object-deleted.v1:
    description: Storage confirma que el objeto MANAGED ya no existe y su cuota fue liberada.
    publish:
      operationId: publishStoredObjectDeleted
      summary: Objeto MANAGED eliminado
      description: |
        Storage publica este hecho después de completar de forma idempotente
        la eliminación física y la liberación de cuota. Movies puede usarlo
        para finalizar DELETING; un duplicado no debe volver a liberar cuota.
      x-owner: mvflix-storage
      x-consumer: mvflix-movies
      x-delivery: at-least-once
      x-partition-key: payload.storageId
      message:
        $ref: '#/components/messages/StoredObjectDeleted'

  mvflix.upload-completed.v1:
    description: Storage confirma que un objeto subido fue validado y quedó disponible.
    publish:
      operationId: publishUploadCompleted
      summary: Upload completado
      description: |
        Storage publica este hecho después de confirmar la transición PENDING a
        COMPLETED y persistir el mensaje en su outbox transaccional.
      x-owner: mvflix-storage
      x-delivery: at-least-once
      x-partition-key: payload.storageId
      message:
        $ref: '#/components/messages/UploadCompleted'

  mvflix.upload-failed.v1:
    description: Storage informa de una subida que terminó en FAILED.
    publish:
      operationId: publishUploadFailed
      x-owner: mvflix-storage
      x-consumer: mvflix-activity
      x-delivery: at-least-once
      x-partition-key: aggregate.id
      message:
        $ref: '#/components/messages/UploadFailed'

  mvflix.playback-progressed.v1:
    description: Playback publica el progreso para construir la proyección de actividad.
    publish:
      operationId: publishPlaybackProgressed
      x-owner: mvflix-playback
      x-consumer: mvflix-activity
      x-delivery: at-least-once
      x-partition-key: aggregate.id
      message:
        $ref: '#/components/messages/PlaybackProgressed'

  mvflix.media-ingestion-started.v1:
    publish:
      operationId: publishMediaIngestionStarted
      x-owner: mvflix-media-ingestion
      message: { $ref: '#/components/messages/MediaIngestionStarted' }
  mvflix.media-ingestion-completed.v1:
    publish:
      operationId: publishMediaIngestionCompleted
      x-owner: mvflix-media-ingestion
      message: { $ref: '#/components/messages/MediaIngestionCompleted' }
  mvflix.media-ingestion-failed.v1:
    publish:
      operationId: publishMediaIngestionFailed
      x-owner: mvflix-media-ingestion
      message: { $ref: '#/components/messages/MediaIngestionFailed' }
  mvflix.media-ingestion-cancelled.v1:
    publish:
      operationId: publishMediaIngestionCancelled
      x-owner: mvflix-media-ingestion
      message: { $ref: '#/components/messages/MediaIngestionCancelled' }

components:
  messages:
    MediaIngestionStarted:
      name: MediaIngestionStarted
      payload: { $ref: '#/components/schemas/MediaIngestionEnvelope' }
      examples:
        - name: media-ingestion-started-v1
          payload: {eventId: 11111111-1111-4111-8111-111111111111, eventType: MediaIngestionStarted, eventVersion: 1, occurredAt: '2026-08-28T12:00:00Z', actorId: user-123, audienceId: user-123, correlationId: 22222222-2222-4222-8222-222222222222, producer: mvflix-media-ingestion, aggregate: {type: MediaIngestion, id: 22222222-2222-4222-8222-222222222222}, payload: {ingestionId: 22222222-2222-4222-8222-222222222222, phase: STARTING, fileName: movie.mp4, catalogItemId: null, failureCode: null}}
    MediaIngestionCompleted:
      name: MediaIngestionCompleted
      payload: { $ref: '#/components/schemas/MediaIngestionEnvelope' }
      examples:
        - name: media-ingestion-completed-v1
          payload: {eventId: 33333333-3333-4333-8333-333333333333, eventType: MediaIngestionCompleted, eventVersion: 1, occurredAt: '2026-08-28T12:01:00Z', actorId: system, audienceId: user-123, correlationId: 22222222-2222-4222-8222-222222222222, producer: mvflix-media-ingestion, aggregate: {type: MediaIngestion, id: 22222222-2222-4222-8222-222222222222}, payload: {ingestionId: 22222222-2222-4222-8222-222222222222, phase: COMPLETED, fileName: movie.mp4, catalogItemId: 101, failureCode: null}}
    MediaIngestionFailed:
      name: MediaIngestionFailed
      payload: { $ref: '#/components/schemas/MediaIngestionEnvelope' }
      examples:
        - name: media-ingestion-failed-v1
          payload: {eventId: 44444444-4444-4444-8444-444444444444, eventType: MediaIngestionFailed, eventVersion: 1, occurredAt: '2026-08-28T12:02:00Z', actorId: system, audienceId: user-123, correlationId: 22222222-2222-4222-8222-222222222222, producer: mvflix-media-ingestion, aggregate: {type: MediaIngestion, id: 22222222-2222-4222-8222-222222222222}, payload: {ingestionId: 22222222-2222-4222-8222-222222222222, phase: FAILED, fileName: movie.mp4, catalogItemId: null, failureCode: CATALOG_UNAVAILABLE}}
    MediaIngestionCancelled:
      name: MediaIngestionCancelled
      payload: { $ref: '#/components/schemas/MediaIngestionEnvelope' }
      examples:
        - name: media-ingestion-cancelled-v1
          payload: {eventId: 55555555-5555-4555-8555-555555555555, eventType: MediaIngestionCancelled, eventVersion: 1, occurredAt: '2026-08-28T12:03:00Z', actorId: system, audienceId: user-123, correlationId: 22222222-2222-4222-8222-222222222222, producer: mvflix-media-ingestion, aggregate: {type: MediaIngestion, id: 22222222-2222-4222-8222-222222222222}, payload: {ingestionId: 22222222-2222-4222-8222-222222222222, phase: CANCELLED, fileName: movie.mp4, catalogItemId: 101, failureCode: null}}
    CatalogItemAdded:
      name: CatalogItemAdded
      title: Catalog item added
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CatalogItemAddedEnvelope'
      examples:
        - name: catalog-item-added-v1
          payload: {eventId: 11111111-1111-4111-8111-111111111111, eventType: CatalogItemAdded, eventVersion: 1, occurredAt: '2026-08-28T12:00:00Z', actorId: Javier, correlationId: 22222222-2222-4222-8222-222222222222, producer: mvflix-movies, aggregate: {type: CatalogItem, id: '101'}, payload: {movieId: 101, ownerUsername: Javier, kind: MOVIE, status: DRAFT}}

    CatalogItemDeleted:
      name: CatalogItemDeleted
      title: Catalog item deleted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CatalogItemDeletedEnvelope'
      examples:
        - name: catalog-item-deleted-v1
          payload: {eventId: 33333333-3333-4333-8333-333333333333, eventType: CatalogItemDeleted, eventVersion: 1, occurredAt: '2026-08-28T12:00:00Z', actorId: Javier, correlationId: 44444444-4444-4444-8444-444444444444, producer: mvflix-movies, aggregate: {type: CatalogItem, id: '101'}, payload: {movieId: 101, ownerUsername: Javier}}

    CatalogItemAccessChanged:
      name: CatalogItemAccessChanged
      title: Catalog item access changed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CatalogItemAccessChangedEnvelope'
      examples:
        - name: catalog-item-access-changed-v1
          payload: {eventId: 11111111-1111-4111-8111-111111111111, eventType: CatalogItemAccessChanged, eventVersion: 1, occurredAt: '2026-09-01T16:00:00Z', actorId: user-123, audienceId: user-123, correlationId: 22222222-2222-4222-8222-222222222222, producer: mvflix-movies, aggregate: {type: CatalogItem, id: '42'}, payload: {catalogItemId: 42, kind: MOVIE, title: Interstellar, previousVisibility: PRIVATE, visibility: SHARED, previousSharedCount: 0, sharedCount: 3}}

    ManagedMediaDeletionRequested:
      name: ManagedMediaDeletionRequested
      title: Managed media deletion requested
      summary: Movies solicita borrar un objeto propiedad de Storage.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ManagedMediaDeletionRequestedEnvelope'
      examples:
        - name: managed-media-deletion-requested-v1
          payload:
            eventId: 88888888-8888-4888-8888-888888888888
            eventType: ManagedMediaDeletionRequested
            eventVersion: 1
            occurredAt: '2026-08-28T12:00:00Z'
            actorId: system
            correlationId: 99999999-9999-4999-8999-999999999999
            producer: mvflix-movies
            aggregate:
              type: Movie
              id: '101'
            payload:
              movieId: 101
              storageId: 42
              ownerUsername: Javier
              objectKey: Javier/videos/dune.mp4
      bindings:
        kafka:
          key:
            type: string
            description: storageId serializado como string.

    StoredObjectDeleted:
      name: StoredObjectDeleted
      title: Stored object deleted
      summary: Storage confirma la eliminación física y liberación de cuota.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StoredObjectDeletedEnvelope'
      examples:
        - name: stored-object-deleted-v1
          summary: Objeto eliminado y cuota liberada
          payload:
            eventId: 7d9f3c1e-6c2d-4d79-9c3a-7fbcd5c6a2a1
            eventType: StoredObjectDeleted
            eventVersion: 1
            occurredAt: '2026-08-28T12:00:00Z'
            actorId: system
            correlationId: 55555555-5555-4555-8555-555555555555
            producer: mvflix-storage
            aggregate:
              type: ManagedObject
              id: '42'
            payload:
              movieId: 101
              storageId: 42
              objectKey: Javier/videos/dune.mp4
              ownerUsername: Javier
              releasedBytes: 734003200
              deletionStatus: DELETED
      bindings:
        kafka:
          key:
            type: string
            description: storageId serializado como string.

    UploadCompleted:
      name: UploadCompleted
      title: Upload completed
      summary: Storage confirma que un objeto está disponible.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/UploadCompletedEnvelope'
      examples:
        - name: upload-completed-v1
          summary: Upload validado y disponible
          payload:
            eventId: 2d6a7e8b-5a44-4bf9-9f2e-1a5f4b2c9d10
            eventType: UploadCompleted
            eventVersion: 1
            occurredAt: '2026-08-28T12:00:00Z'
            actorId: system
            correlationId: 66666666-6666-4666-8666-666666666666
            producer: mvflix-storage
            aggregate:
              type: ManagedObject
              id: '42'
            payload:
              storageId: 42
              ownerUsername: Javier
              objectKey: Javier/videos/dune.mp4
              contentType: video/mp4
              contentLength: 734003200
      bindings:
        kafka:
          key:
            type: string
            description: storageId serializado como string.

    UploadFailed:
      name: UploadFailed
      title: Upload failed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/UploadFailedEnvelope'
      examples:
        - name: upload-failed-v1
          payload:
            eventId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
            eventType: UploadFailed
            eventVersion: 1
            occurredAt: '2026-08-28T12:05:00Z'
            actorId: system
            correlationId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
            producer: mvflix-storage
            aggregate:
              type: ManagedObject
              id: '42'
            payload:
              storageId: 42
              ownerUsername: Javier
              objectKey: Javier/videos/dune.mp4
              reason: VALIDATION_FAILED

    PlaybackProgressed:
      name: PlaybackProgressed
      title: Playback progressed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlaybackProgressedEnvelope'
      examples:
        - name: playback-progressed-v1
          payload:
            eventId: 7d9f3c1e-6c2d-4d79-9c3a-7fbcd5c6a2a1
            eventType: PlaybackProgressed
            eventVersion: 1
            occurredAt: '2026-08-28T12:00:00Z'
            actorId: Javier
            audienceId: Javier
            correlationId: 77777777-7777-4777-8777-777777777777
            causationId: null
            producer: mvflix-playback
            aggregate: { type: PlaybackSession, id: 11111111-1111-4111-8111-111111111111 }
            payload: { ownerUsername: Javier, movieId: 101, mediaId: 3, contentReferenceType: LIBRARY_ASSET, contentReferenceId: 3, sessionId: 11111111-1111-4111-8111-111111111111, positionSeconds: 120, durationSeconds: 7200, completed: false, sequence: 4 }

  schemas:
    MediaIngestionEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { type: string, enum: [MediaIngestionStarted, MediaIngestionCompleted, MediaIngestionFailed, MediaIngestionCancelled] }
            eventVersion: { type: integer, enum: [1] }
            producer: { type: string, enum: [mvflix-media-ingestion] }
            aggregate: { $ref: '#/components/schemas/AggregateReference' }
            payload:
              type: object
              additionalProperties: false
              required: [ingestionId, phase, fileName, catalogItemId, failureCode]
              properties:
                ingestionId: { type: string, format: uuid }
                phase: { type: string }
                fileName: { type: string }
                catalogItemId: { type: integer, format: int64, nullable: true }
                failureCode: { type: string, nullable: true }
          required: [audienceId]
    EventEnvelope:
      type: object
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador único e inmutable para deduplicación.
        eventType:
          type: string
          description: Nombre estable del evento.
        eventVersion:
          type: integer
          minimum: 1
          description: Versión del schema del payload, independiente del topic.
        occurredAt:
          type: string
          format: date-time
        actorId:
          type: string
          description: Username estable del actor; los flujos internos usan system.
        audienceId:
          type: string
          nullable: true
          description: Identidad estable de quien debe ver la actividad, cuando aplica.
        producer:
          type: string
          description: Servicio que posee y publicó el hecho.
        aggregate:
          $ref: '#/components/schemas/AggregateReference'
        correlationId:
          type: string
          format: uuid
          nullable: true
        causationId:
          type: string
          format: uuid
          nullable: true
        payload:
          type: object
      required:
        - eventId
        - eventType
        - eventVersion
        - occurredAt
        - actorId
        - correlationId
        - producer
        - aggregate
        - payload

    AggregateReference:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          example: ManagedObject
        id:
          type: string
          description: Identificador del agregado en el servicio propietario.
      required:
        - type
        - id

    ManagedMediaDeletionRequestedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              type: string
              enum: [ManagedMediaDeletionRequested]
            eventVersion:
              type: integer
              enum: [1]
            producer:
              type: string
              enum: [mvflix-movies]
            aggregate:
              $ref: '#/components/schemas/MovieAggregateReference'
            payload:
              $ref: '#/components/schemas/ManagedMediaDeletionRequestedPayload'

    CatalogItemAddedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: {type: string, enum: [CatalogItemAdded]}
            eventVersion: {type: integer, enum: [1]}
            producer: {type: string, enum: [mvflix-movies]}
            aggregate: {$ref: '#/components/schemas/CatalogItemAggregateReference'}
            payload: {$ref: '#/components/schemas/CatalogItemAddedPayload'}

    CatalogItemDeletedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: {type: string, enum: [CatalogItemDeleted]}
            eventVersion: {type: integer, enum: [1]}
            producer: {type: string, enum: [mvflix-movies]}
            aggregate: {$ref: '#/components/schemas/CatalogItemAggregateReference'}
            payload: {$ref: '#/components/schemas/CatalogItemDeletedPayload'}

    CatalogItemAccessChangedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: {type: string, enum: [CatalogItemAccessChanged]}
            eventVersion: {type: integer, enum: [1]}
            producer: {type: string, enum: [mvflix-movies]}
            aggregate: {$ref: '#/components/schemas/CatalogItemAggregateReference'}
            payload: {$ref: '#/components/schemas/CatalogItemAccessChangedPayload'}

    StoredObjectDeletedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              type: string
              enum: [StoredObjectDeleted]
            eventVersion:
              type: integer
              enum: [1]
            producer:
              type: string
              enum: [mvflix-storage]
            aggregate:
              $ref: '#/components/schemas/ManagedObjectAggregateReference'
            payload:
              $ref: '#/components/schemas/StoredObjectDeletedPayload'

    UploadCompletedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              type: string
              enum: [UploadCompleted]
            eventVersion:
              type: integer
              enum: [1]
            producer:
              type: string
              enum: [mvflix-storage]
            aggregate:
              $ref: '#/components/schemas/ManagedObjectAggregateReference'
            payload:
              $ref: '#/components/schemas/UploadCompletedPayload'

    UploadFailedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: {type: string, enum: [UploadFailed]}
            eventVersion: {type: integer, enum: [1]}
            producer: {type: string, enum: [mvflix-storage]}
            aggregate:
              allOf:
                - $ref: '#/components/schemas/AggregateReference'
                - type: object
                  properties: {type: {type: string, enum: [ManagedObject]}}
            payload: {$ref: '#/components/schemas/UploadFailedPayload'}

    PlaybackProgressedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { type: string, enum: [PlaybackProgressed] }
            eventVersion: { type: integer, enum: [1] }
            producer: { type: string, enum: [mvflix-playback] }
            aggregate:
              allOf:
                - $ref: '#/components/schemas/AggregateReference'
                - type: object
                  properties: { type: { type: string, enum: [PlaybackSession] } }
            payload:
              $ref: '#/components/schemas/PlaybackProgressedPayload'

    MovieAggregateReference:
      allOf:
        - $ref: '#/components/schemas/AggregateReference'
        - type: object
          properties:
            type:
              type: string
              enum: [Movie]

    CatalogItemAggregateReference:
      allOf:
        - $ref: '#/components/schemas/AggregateReference'
        - type: object
          properties:
            type: {type: string, enum: [CatalogItem]}

    CatalogItemAddedPayload:
      type: object
      additionalProperties: false
      properties:
        movieId: {type: integer, format: int64}
        ownerUsername: {type: string}
        kind: {type: string, enum: [MOVIE, VIDEO]}
        status: {type: string, enum: [DRAFT, READY]}
      required: [movieId, ownerUsername, kind, status]

    CatalogItemDeletedPayload:
      type: object
      additionalProperties: false
      properties:
        movieId: {type: integer, format: int64}
        ownerUsername: {type: string}
      required: [movieId, ownerUsername]

    CatalogItemAccessChangedPayload:
      type: object
      additionalProperties: false
      properties:
        catalogItemId: {type: integer, format: int64}
        kind: {type: string, enum: [MOVIE, VIDEO]}
        title: {type: string}
        previousVisibility: {type: string, enum: [PRIVATE, PUBLIC, SHARED]}
        visibility: {type: string, enum: [PRIVATE, PUBLIC, SHARED]}
        previousSharedCount: {type: integer, minimum: 0}
        sharedCount: {type: integer, minimum: 0}
      required: [catalogItemId, kind, title, previousVisibility, visibility, previousSharedCount, sharedCount]

    ManagedObjectAggregateReference:
      allOf:
        - $ref: '#/components/schemas/AggregateReference'
        - type: object
          properties:
            type:
              type: string
              enum: [ManagedObject]

    ManagedMediaDeletionRequestedPayload:
      type: object
      additionalProperties: false
      properties:
        movieId:
          type: integer
          format: int64
          description: Identificador del catálogo en Movies.
        storageId:
          type: integer
          format: int64
          description: Identificador público del objeto en Storage.
        ownerUsername:
          type: string
          description: Owner esperado; Storage lo valida antes de borrar.
        objectKey:
          type: string
          description: Referencia interna esperada; nunca se expone al BFF.
      required:
        - movieId
        - storageId
        - ownerUsername
        - objectKey

    StoredObjectDeletedPayload:
      type: object
      additionalProperties: false
      properties:
        movieId:
          type: integer
          format: int64
          description: Identificador del catálogo en Movies.
        storageId:
          type: integer
          format: int64
        uploadId:
          type: string
          description: Referencia opcional para correlación con una ingestión; añadirla no rompe v1.
        objectKey:
          type: string
          description: Referencia interna del objeto eliminado.
        ownerUsername:
          type: string
        releasedBytes:
          type: integer
          format: int64
          minimum: 0
          description: Cuota liberada por Storage; no debe aplicarse dos veces.
        deletionStatus:
          type: string
          enum: [DELETED, ALREADY_ABSENT]
      required:
        - movieId
        - storageId
        - objectKey
        - ownerUsername
        - releasedBytes
        - deletionStatus

    UploadCompletedPayload:
      type: object
      additionalProperties: false
      properties:
        storageId:
          type: integer
          format: int64
        ownerUsername:
          type: string
        objectKey:
          type: string
        contentType:
          type: string
        contentLength:
          type: integer
          format: int64
          minimum: 0
      required:
        - storageId
        - ownerUsername
        - objectKey
        - contentType
        - contentLength

    UploadFailedPayload:
      type: object
      additionalProperties: false
      properties:
        storageId: {type: integer, format: int64, minimum: 1}
