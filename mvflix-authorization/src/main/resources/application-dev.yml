spring:
  application:
    name: authorization-service

  security:
    user:
      name: ${ACTUATOR_METRICS_USER:metrics}
      password: ${ACTUATOR_METRICS_PASSWORD:change-me}
    oauth2:
      authorizationserver:
        # Issuer fijo del auth: los JWT (login real y dev-token) llevan este iss y los
        # resource servers (users) lo validan. En LAN, apuntarlo a la IP de la maquina.
        issuer: ${AUTHORIZATION_ISSUER_URL:http://127.0.0.1:9090}

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/mvflix_authorized_db
    username: ${DB_RW_USER:db_rw}
    password: ${DB_RW_PASSWORD:12345678}

  flyway:
    enabled: true
    user: db_migrator
    password: ${DB_RW_PASSWORD:12345678}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

logging:
  level:
    root: info
    '[org.springframework.web]': debug
    org.springframework.security: debug
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: trace
    org.springframework.security.oauth2: debug
    org.springframework.data.redis: debug
    jakarta.jms: debug

authorization:
  env:
    oauth2:
      registration-id: movie-app
      client-id: movie-bff
      client-password: super-secret
      # Secret dedicado del machine-client movies-catalog (Movies → Storage).
      movies-catalog-password: ${MOVIES_CATALOG_SECRET:super-secret}
      # Secret dedicado del machine-client media-ingestion (Ingestion → Movies/Storage).
      media-ingestion-password: ${MEDIA_INGESTION_SECRET:super-secret}
      redirect: ${BFF_ADDRESS:http://127.0.0.1:9091}${BFF_PATH_REDIRECT:/login/oauth2/code/movie-app}
      logout-redirect: ${FRONTEND_ADDRESS:http://127.0.0.1:9090}${PATH_LOGOUT_REDIRECT:/}
    # jwk:
    #   uri: "lb://authorization-service/oauth2/jwks"
    api:
      path-base: /api/v1/authorization
  dev-token:
    enabled: true

server:
  address: 0.0.0.0
  port: 9090
