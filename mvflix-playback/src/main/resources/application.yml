server.port: ${PLAYBACK_PORT_INTERNAL:7070}
spring:
  application.name: mvflix-playback
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mvflix_playback_db}
    username: ${DB_USERNAME:db_rw}
    password: ${DB_RW_PASSWORD:12345678}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mvflix_playback_db}
    username: ${DB_MIGRATOR_USERNAME:db_migrator}
    password: ${DB_MIGRATOR_PASSWORD:12345678}
  flyway.locations: classpath:db/migration
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
    port: ${MANAGEMENT_SERVER_PORT:10071}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${SECURITY_OAUTH2_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
services:
  movies.url: ${SERVICES_MOVIES_URL:http://localhost:4040}
  storage.url: ${SERVICES_STORAGE_URL:http://localhost:6060}
  authorization.url: ${SERVICES_AUTHORIZATION_URL:http://localhost:8081}
