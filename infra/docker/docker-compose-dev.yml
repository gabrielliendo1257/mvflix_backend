services:
  minio:
    image: ${MVFLIX_MINIO_IMAGE}
    container_name: minio-container

    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?define MINIO_ROOT_USER en infra/docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?define MINIO_ROOT_PASSWORD en infra/docker/.env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:4200,http://localhost:9090}
      MINIO_NOTIFY_WEBHOOK_ENABLE_upload: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_upload: ${MINIO_WEBHOOK_ENDPOINT:-http://host.docker.internal:6060/internal/minio/events}
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_upload: ${MINIO_WEBHOOK_TOKEN:-dev-webhook-secret}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: server /data --console-address ":9001"

    volumes:
      - "${MINIO_DATA_SOURCE:-minio_data}:/data"

    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  minio-init:
    image: ${MVFLIX_MINIO_MC_IMAGE}
    container_name: minio-init

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/users;
      mc anonymous set none local/users;
      mc mb --ignore-existing local/uploads;
      mc anonymous set none local/uploads;
      mc event rm --force local/uploads arn:minio:sqs::upload:webhook;
      mc event add local/uploads arn:minio:sqs::upload:webhook --event 'put';
      exit 0;
      "

  postgres:
    image: ${MVFLIX_POSTGRES_IMAGE}
    container_name: postgres
    restart: unless-stopped
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en infra/docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en infra/docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-mvflix_app}
    ports:
    - "5432:5432"
    volumes:
      - pg_volume:/var/lib/postgresql/data:rw
      - ../postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 120s

  kafka:
    image: ${MVFLIX_KAFKA_IMAGE}
    container_name: kafka
    restart: unless-stopped

    # El listener externo debe ser accesible desde Termux u otros clientes de
    # la LAN. El listener interno y el de controller no se exponen a la LAN.
    ports:
      - "0.0.0.0:${KAFKA_EXTERNAL_PORT:-9094}:9094"

    environment:
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-abcdefghijklmnopqrstuv}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-1}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-536870912}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: ${KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:-300000}

    volumes:
      - "${KAFKA_DATA_SOURCE:-kafka_data}:/tmp/kraft-combined-logs"

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: ${MVFLIX_KAFKA_IMAGE}
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-ec" ]
    command:
      - |
        for topic in \
          mvflix.managed-media-deletion-requested.v1 \
          mvflix.catalog-item-added.v1 \
          mvflix.catalog-item-deleted.v1 \
          mvflix.managed-media-deletion-requested.v1.retry-0 \
          mvflix.managed-media-deletion-requested.v1.retry-1 \
          mvflix.managed-media-deletion-requested.v1.retry-2 \
          mvflix.managed-media-deletion-requested.v1.DLT \
          mvflix.stored-object-deleted.v1 \
          mvflix.stored-object-deleted.v1.retry-0 \
          mvflix.stored-object-deleted.v1.retry-1 \
           mvflix.stored-object-deleted.v1.retry-2 \
           mvflix.stored-object-deleted.v1.DLT \
           mvflix.upload-completed.v1 \
           mvflix.upload-completed.v1.retry-0 \
           mvflix.upload-completed.v1.retry-1 \
           mvflix.upload-completed.v1.retry-2 \
           mvflix.upload-completed.v1.DLT \
           mvflix.playback-progressed.v1 \
           mvflix.playback-progressed.v1.retry-0 \
           mvflix.playback-progressed.v1.retry-1 \
           mvflix.playback-progressed.v1.retry-2 \
           mvflix.playback-progressed.v1.DLT \
           mvflix.media-ingestion-started.v1 \
           mvflix.media-ingestion-completed.v1 \
           mvflix.media-ingestion-failed.v1 \
           mvflix.media-ingestion-cancelled.v1 \
           mvflix.catalog-item-access-changed.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${topic}" --partitions ${KAFKA_NUM_PARTITIONS:-1} --replication-factor 1 \
            --config retention.ms=${KAFKA_LOG_RETENTION_MS:-604800000} \
             --config retention.bytes=${KAFKA_LOG_RETENTION_BYTES:-1073741824}
          done

  media-ingestion:
    build:
      context: ../..
      dockerfile: mvflix-media-ingestion/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mvflix_media_ingestion_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MVFLIX_MESSAGING_KAFKA_ENABLED: ${MVFLIX_MESSAGING_KAFKA_ENABLED:-false}
      MOVIES_URL: ${MOVIES_URL:-http://host.docker.internal:4040}
      STORAGE_URL: ${STORAGE_URL:-http://host.docker.internal:6060}
      USERS_URL: ${USERS_URL:-http://host.docker.internal:8080}
      MVFLIX_INTERNAL_TOKEN_URI: ${MVFLIX_INTERNAL_TOKEN_URI:-http://host.docker.internal:8081/oauth2/token}
      SECURITY_OAUTH2_JWK_SET_URI: ${SECURITY_OAUTH2_JWK_SET_URI:-http://host.docker.internal:8081/oauth2/jwks}
      MANAGEMENT_SERVER_PORT: 10080
    ports:
      - "${MEDIA_INGESTION_PORT:-7080}:8080"
      - "${MEDIA_INGESTION_MANAGEMENT_PORT:-10080}:10080"
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    extra_hosts: ["host.docker.internal:host-gateway"]

  activity:
    build:
      context: ../..
      dockerfile: mvflix-activity/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mvflix_activity_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MVFLIX_MESSAGING_KAFKA_ENABLED: ${MVFLIX_MESSAGING_KAFKA_ENABLED:-false}
      SECURITY_OAUTH2_JWK_SET_URI: ${SECURITY_OAUTH2_JWK_SET_URI:-http://host.docker.internal:8081/oauth2/jwks}
      MANAGEMENT_SERVER_PORT: 10070
    ports:
      - "${ACTIVITY_PORT:-7070}:8080"
      - "${ACTIVITY_MANAGEMENT_PORT:-10070}:10070"
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    extra_hosts: ["host.docker.internal:host-gateway"]

  prometheus:
    image: ${MVFLIX_PROMETHEUS_IMAGE}
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.expand-env=true
      - --storage.tsdb.path=/prometheus
    environment:
      ACTUATOR_METRICS_USER: ${ACTUATOR_METRICS_USER:-metrics}
      ACTUATOR_METRICS_PASSWORD: ${ACTUATOR_METRICS_PASSWORD:-change-me}
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9095}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started

  tempo:
    image: ${MVFLIX_TEMPO_IMAGE}
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  otel-collector:
    image: ${MVFLIX_OTEL_COLLECTOR_IMAGE}
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "${OTEL_BIND_ADDRESS:-0.0.0.0}:${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      tempo:
        condition: service_started

  grafana:
    image: ${MVFLIX_GRAFANA_IMAGE}
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  minio_data:
    driver: local
  pg_volume:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local
