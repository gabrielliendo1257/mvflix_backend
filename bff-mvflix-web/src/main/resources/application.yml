management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
    port: ${MANAGEMENT_SERVER_PORT:10091}
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:mvflix},traceId=%X{traceId:-},spanId=%X{spanId:-},correlationId=%X{correlationId:-}] "

spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:mvflix_app}
    username: ${DB_RW_USER:db_rw}
    password: ${DB_RW_PASSWORD:12345678}
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:mvflix_app}
    username: ${DB_MIGRATOR_USER:db_migrator}
    password: ${DB_MIGRATOR_PASSWORD:12345678}

services:
  media-ingestion:
    url: ${MEDIA_INGESTION_URL:http://localhost:8080}
  activity:
    url: ${ACTIVITY_URL:http://localhost:7070}
  playback:
    url: ${PLAYBACK_URL:http://localhost:7071}

features:
  add-media:
    media-ingestion-enabled: ${MEDIA_INGESTION_ENABLED:true}
