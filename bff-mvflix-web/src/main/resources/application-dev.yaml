spring:
  application:
    name: bff-mvflix-web
  codec:
    max-in-memory-size: 32MB
  security:
    oauth2:
      client:
        registration:
          movie-app:
            provider: mvflix-auth
            client-id: movie-bff
            client-secret: super-secret
            #client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}" # ${BFF_ADDRESS:http://127.0.0.1:9091}${BFF_PATH_REDIRECT:/login/oauth2/code/movie-app}
            scope: users.read,users.write,openid
          storage-playback:
            provider: mvflix-auth
            client-id: movies-playback
            client-secret: ${STORAGE_PLAYBACK_SECRET:super-secret}
            authorization-grant-type: client_credentials

            scope: storage.stream
        provider:
          mvflix-auth:
            authorization-uri: ${AUTHORIZATION_URL:http://127.0.0.1:9090}/oauth2/authorize
            token-uri: ${AUTHORIZATION_URL:http://127.0.0.1:9090}/oauth2/token
            user-info-uri: ${AUTHORIZATION_URL:http://127.0.0.1:9090}/userinfo
            jwk-set-uri: ${SECURITY_OAUTH2_JWK_SET_URI:http://127.0.0.1:9090/oauth2/jwks}

mvflix:
  security:
    actuator-username: ${ACTUATOR_METRICS_USER:metrics}
    actuator-password: ${ACTUATOR_METRICS_PASSWORD:change-me}

server:
  port: 9091
  reactive:
    session:
      # La sesion del navegador guarda el authorized client (con su refresh token de
      # 5 dias en el auth-server). Sin esto, la WebSession muere a los 30 min de
      # inactividad (default de Boot) aunque el refresh token siga vivo: el usuario
      # tendria que re-loguear cada 30 min. Se alinea con el TTL del refresh token.
      timeout: 5d
      cookie:
        # Persistente para sobrevivir al cierre del navegador, igualando el timeout
        # de sesion; si es cookie de sesion, se pierde el refresh token al cerrar.
        max-age: 5d
        # Prefijo __Host- (RFC 6265bis): exige Secure + Path=/ + sin Domain, protege
        # contra cookie tossing. En 127.0.0.1/localhost el navegador acepta Secure
        # (potentially trustworthy), asi que tambien vale en dev. Ojo: si se accede
        # por otra IP en dev, el navegador rechazaria la cookie. En LAN por HTTP hay
        # que bajar el prefijo a SESSION y Secure a false (ver README, seccion LAN).
        name: ${BFF_SESSION_COOKIE_NAME:__Host-SESSION}
        path: /
        secure: ${BFF_SESSION_COOKIE_SECURE:true}
        # Front (4200) y BFF (9091) son same-site (mismo registrable domain): Lax
        # no bloquea el fetch con credentials y es defensa en profundidad.
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
    port: ${MANAGEMENT_SERVER_PORT:10091}

logging:
  level:
    root: info
    com.guille.media.bff: debug
    org.springframework.security: TRACE
    org.springframework.security.oauth2: debug
    org.springframework.security.oauth2.client: TRACE
    org.springframework.security.oauth2.client.web: TRACE
    org.springframework.security.web.server: TRACE
    org.springframework.web: debug
    org.springframework.web.reactive.function.client: debug
    org.springframework.http.client.reactive: debug
    reactor.netty.http.client: debug

security:
  oauth2:
    jwk-set-uri: ${SECURITY_OAUTH2_JWK_SET_URI:http://127.0.0.1:9090/oauth2/jwks}

services:
  users:
    url: ${SERVICES_USERS_URL:http://127.0.0.1:8080}
  storage:
    url: ${SERVICES_STORAGE_URL:http://127.0.0.1:6060}
  movies:
    url: ${SERVICES_MOVIES_URL:http://127.0.0.1:4040}
  authorization:
    url: ${AUTHORIZATION_URL:http://127.0.0.1:9090}

frontend:
  url: ${FRONTEND_URL:http://127.0.0.1:4200}

bff:
  cors:
    allowed-origins: ${BFF_CORS_ALLOWED_ORIGINS:}
  webclient:
    connect-timeout-ms: 2000
    response-timeout-ms: 30000
