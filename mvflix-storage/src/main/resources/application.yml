management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
    port: ${MANAGEMENT_SERVER_PORT:10060}
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:mvflix},traceId=%X{traceId:-},spanId=%X{spanId:-},correlationId=%X{correlationId:-}] "

spring:
  kafka:
    template:
      observation-enabled: true

mvflix:
  messaging:
    kafka:
      enabled: false
    listener:
      observation-enabled: true

storage:
  multipart:
    part-size-bytes: ${STORAGE_MULTIPART_PART_SIZE:10485760}
    ttl: ${STORAGE_MULTIPART_TTL:PT1H}
    url-ttl: ${STORAGE_MULTIPART_URL_TTL:PT15M}
  retention:
    outbox-published: ${STORAGE_OUTBOX_PUBLISHED_RETENTION:P14D}
    inbox-completed: ${STORAGE_INBOX_COMPLETED_RETENTION:P30D}
    poll-interval: ${STORAGE_RETENTION_POLL_INTERVAL:PT1H}
