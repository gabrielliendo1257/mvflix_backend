spring:
  application:
    name: mvflix-users

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/mvflix_users_db
    username: ${DB_RW_USER:db_rw}
    password: ${DB_RW_PASSWORD:12345678}

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/mvflix_users_db
    username: ${DB_MIGRATOR_USER:db_migrator}
    password: ${DB_MIGRATOR_PASSWORD:12345678}

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SECURITY_OAUTH2_ISSUER_URI:http://127.0.0.1:9090}
          jwk-set-uri: ${SECURITY_OAUTH2_JWK_SET_URI:http://127.0.0.1:9090/oauth2/jwks}

mvflix:
  security:
    actuator-username: ${ACTUATOR_METRICS_USER:metrics}
    actuator-password: ${ACTUATOR_METRICS_PASSWORD:change-me}

services:
  authorization:
    url: ${AUTHORIZATION_URL:http://localhost:9090}

server:
  port: 8080

management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
    port: ${MANAGEMENT_SERVER_PORT:10080}
