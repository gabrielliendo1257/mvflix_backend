server.port: ${ACTIVITY_PORT_INTERNAL:8080}
spring:
  application.name: mvflix-activity
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mvflix_activity_db}
    username: ${DB_USERNAME:db_rw}
    password: ${DB_RW_PASSWORD:12345678}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mvflix_activity_db}
    username: ${DB_MIGRATOR_USERNAME:db_migrator}
    password: ${DB_MIGRATOR_PASSWORD:12345678}
  flyway.locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    template.observation-enabled: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    consumer.properties.spring.json.trusted.packages: com.gcorp.service.app.mvflix_activity
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
    port: ${MANAGEMENT_SERVER_PORT:10070}
  tracing.sampling.probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
security.oauth2.jwk-set-uri: ${SECURITY_OAUTH2_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
mvflix:
  messaging.kafka.enabled: ${MVFLIX_MESSAGING_KAFKA_ENABLED:false}
  messaging.kafka.playback-progressed-topic: ${MVFLIX_PLAYBACK_PROGRESS_TOPIC:mvflix.playback-progressed.v1}
  messaging.kafka.consumer-group: ${MVFLIX_ACTIVITY_KAFKA_GROUP:mvflix-activity}
  messaging.kafka.media-ingestion-topics: ${MVFLIX_MEDIA_INGESTION_ACTIVITY_TOPICS:mvflix.media-ingestion-started.v1,mvflix.media-ingestion-completed.v1,mvflix.media-ingestion-failed.v1,mvflix.media-ingestion-cancelled.v1}
  messaging.kafka.feed-consumer-group: ${MVFLIX_ACTIVITY_FEED_KAFKA_GROUP:mvflix-activity-feed}
  messaging.kafka.catalog-access-topic: ${MVFLIX_CATALOG_ACCESS_ACTIVITY_TOPIC:mvflix.catalog-item-access-changed.v1}
  messaging.kafka.catalog-access-consumer-group: ${MVFLIX_CATALOG_ACCESS_KAFKA_GROUP:mvflix-activity-catalog-access}
  messaging.kafka.upload-failed-topic: ${MVFLIX_UPLOAD_FAILED_ACTIVITY_TOPIC:mvflix.upload-failed.v1}
  messaging.kafka.upload-failed-consumer-group: ${MVFLIX_UPLOAD_FAILED_KAFKA_GROUP:mvflix-activity-upload-failed}
