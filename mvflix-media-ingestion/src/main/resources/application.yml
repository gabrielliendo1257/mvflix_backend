server.port: ${MEDIA_INGESTION_PORT_INTERNAL:8080}
spring:
  application.name: mvflix-media-ingestion
  security:
    oauth2:
      client:
        provider:
          internal:
            token-uri: ${MVFLIX_INTERNAL_TOKEN_URI:http://localhost:8081/oauth2/token}
        registration:
          movies:
            provider: internal
            authorization-grant-type: client_credentials
            client-id: ${MVFLIX_MOVIES_CLIENT_ID:media-ingestion}
            client-secret: ${MVFLIX_MOVIES_CLIENT_SECRET:super-secret}
            scope: ${MVFLIX_MOVIES_CLIENT_SCOPES:media-ingestion}
          storage:
            provider: internal
            authorization-grant-type: client_credentials
            client-id: ${MVFLIX_STORAGE_CLIENT_ID:media-ingestion}
            client-secret: ${MVFLIX_STORAGE_CLIENT_SECRET:super-secret}
            scope: ${MVFLIX_STORAGE_CLIENT_SCOPES:media-ingestion}
          users:
            provider: internal
            authorization-grant-type: client_credentials
            client-id: ${MVFLIX_USERS_CLIENT_ID:media-ingestion}
            client-secret: ${MVFLIX_USERS_CLIENT_SECRET:super-secret}
            scope: ${MVFLIX_USERS_CLIENT_SCOPES:media-ingestion}
  r2dbc.url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mvflix_media_ingestion_db}
  r2dbc.username: ${DB_USERNAME:db_rw}
  r2dbc.password: ${DB_RW_PASSWORD:12345678}
  datasource.url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mvflix_media_ingestion_db}
  datasource.username: ${DB_MIGRATOR_USERNAME:db_migrator}
  datasource.password: ${DB_MIGRATOR_PASSWORD:12345678}
  flyway.locations: classpath:db/migration
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
  kafka.consumer.auto-offset-reset: earliest
management.endpoints.web.exposure.include: health,info,metrics,prometheus
management.endpoint.health.probes.enabled: true
management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
    port: ${MANAGEMENT_SERVER_PORT:10081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${SECURITY_OAUTH2_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
mvflix:
  messaging.kafka.enabled: ${MVFLIX_MESSAGING_KAFKA_ENABLED:false}
  messaging.kafka.upload-completed-topic: ${MVFLIX_UPLOAD_COMPLETED_TOPIC:mvflix.upload-completed.v1}
  messaging.kafka.consumer-group: ${MVFLIX_MEDIA_INGESTION_KAFKA_GROUP:mvflix-media-ingestion}
  downstream.movies-url: ${MOVIES_URL:http://localhost:4040}
  downstream.storage-url: ${STORAGE_URL:http://localhost:6060}
  downstream.users-url: ${USERS_URL:http://localhost:8080}
  downstream.response-timeout-seconds: ${MVFLIX_DOWNSTREAM_RESPONSE_TIMEOUT_SECONDS:10}
  recovery.enabled: ${MVFLIX_RECOVERY_ENABLED:true}
  recovery.poll-ms: ${MVFLIX_RECOVERY_POLL_MS:5000}
  recovery.stale-after-seconds: ${MVFLIX_RECOVERY_STALE_AFTER_SECONDS:30}
  compensation.enabled: ${MVFLIX_COMPENSATION_ENABLED:true}
